naftiko: 1.0.0-alpha2
info:
  label: 0x API — Sources
  description: '0x API — Sources. 1 operations. Lead operation: Get Liquidity Sources. Self-contained Naftiko capability covering
    one 0x business surface.'
  tags:
  - 0x
  - 0X Api
  - Sources
  created: '2026-05-28'
  modified: '2026-05-28'
binds:
- namespace: env
  keys:
    0X_API_KEY: 0X_API_KEY
capability:
  consumes:
  - type: http
    namespace: 0x-api-sources
    baseUri: https://api.0x.org
    description: 0x API — Sources business capability. Self-contained, no shared references.
    authentication:
      type: apiKey
      in: header
      name: 0x-api-key
      value: '{{env.0X_API_KEY}}'
    defaultHeaders:
      0x-version: v2
    resources:
    - name: sources
      path: /sources
      operations:
      - name: sources-getsources
        method: GET
        path: /sources
        description: Get Liquidity Sources
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: 0x-api-key
          in: header
          type: string
          required: true
          description: Visit dashboard.0x.org to get your API Key
        - name: 0x-version
          in: header
          type: string
          required: true
          description: API version
        - name: chainId
          in: query
          type: integer
          required: true
          description: Chain ID. See [here](https://docs.0x.org/docs/introduction/supported-chains) for the list of supported
            chains
  exposes:
  - type: rest
    namespace: 0x-api-sources-rest
    port: 8080
    description: REST adapter for 0x API — Sources. One Spectral-compliant resource per consumed operation.
    resources:
    - path: /sources
      name: sources
      description: REST surface for sources.
      operations:
      - method: GET
        name: sources-getsources
        description: Get Liquidity Sources
        call: 0x-api-sources.sources-getsources
        with:
          0x-api-key: rest.0x-api-key
          0x-version: rest.0x-version
          chainId: rest.chainId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: 0x-api-sources-mcp
    port: 9090
    transport: http
    description: MCP adapter for 0x API — Sources. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: 0x-sources-getsources
      description: Get Liquidity Sources
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: 0x-api-sources.sources-getsources
      with:
        0x-api-key: tools.0x-api-key
        0x-version: tools.0x-version
        chainId: tools.chainId
      outputParameters:
      - type: object
        mapping: $.
