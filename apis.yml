aid: 0x
url: https://raw.githubusercontent.com/api-evangelist/0x/refs/heads/main/apis.yml
name: 0x
kind: company
description: >-
  0x is the institutional-grade DEX aggregation and crypto liquidity
  infrastructure platform that powers token swaps inside hundreds of consumer
  wallets, exchanges, and onchain apps. The 0x API surface aggregates 150+
  liquidity sources — public AMMs and exclusive professional market makers —
  across 20+ EVM chains, exposing four primary products: the Swap API
  (AllowanceHolder and Permit2 flows) for on-chain swaps, the Gasless API for
  swaps with no native gas token, the Cross-Chain API for any-token any-chain
  bridging across 16+ providers, and the Trade Analytics API for monetisation
  and reporting. Settlement is performed by the 0x Settler smart contracts
  using the Permit2 standard, and integrators get a unified API key, a
  TypeScript SDK, an official Agent Skill, and an MCP server for AI-assisted
  development.
accessModel:
