  /swap/chains:
    get:
      operationId: swap::chains
      summary: Get Supported Chains
      description: Get list of supported chains for swap
      tags:
      - Swap
      parameters:
      - description: Visit dashboard.0x.org to get your API Key
        in: header
        name: 0x-api-key
        required: true
        schema:
          type: string
      - description: API version
        in: header
        name: 0x-version
        required: true
        schema:
          type: string
          example: v2
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  chains:
                    type: array
                    items:
                      type: object
                      properties:
                        chainId:
                          type: number
                        chainName:
                          type: string
                      required:
                      - chainId
                      - chainName
                      additionalProperties: false
                  zid:
                    type: string
                    description: The unique ZeroEx identifier of the request
                required:
                - chains
                - zid
                additionalProperties: false
              example:
              - chainName: Ethereum
                chainId: '1'
              - chainName: Optimism
                chainId: '10'
              - chainName: BSC
                chainId: '56'
              - chainName: Polygon
                chainId: '137'
              - chainName: Base
                chainId: '8453'
              - chainName: Arbitrum
                chainId: '42161'
              - chainName: Avalanche
                chainId: '43114'
              - chainName: Linea
                chainId: '59144'
              - chainName: Scroll
                chainId: '534352'
              - chainName: Mantle
                chainId: '5000'
              - chainName: Blast
                chainId: '81457'
              - chainName: Mode
                chainId: '34443'
        '500':
          description: 500 error response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/INTERNAL_SERVER_ERROR'
                - $ref: '#/components/schemas/UNCATEGORIZED'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
