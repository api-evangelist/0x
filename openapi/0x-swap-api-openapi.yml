                      routes:
                        type: object
                        properties:
                          forward:
                            type: object
                            properties:
                              fills:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    from:
                                      type: string
                                      pattern: ^0x[a-fA-F0-9]{40}$
                                      description: The contract address of the input token
                                    to:
                                      type: string
                                      pattern: ^0x[a-fA-F0-9]{40}$
                                      description: The contract address of the output token
                                    source:
                                      type: string
                                      description: The liquidity source used in the route
                                    proportionBps:
                                      allOf:
                                      - {}
                                      - type: string
                                        pattern: ^[-+]?(0|[1-9]\d*)(\.\d+)?$
                                      description: The proportion of the trade to be filled by the `source`
                                  required:
                                  - from
                                  - to
                                  - source
                                  - proportionBps
                                  additionalProperties: false
                                description: Details of each segment that 0x routes the swap through
                              tokens:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    address:
                                      type: string
                                      pattern: ^0x[a-fA-F0-9]{40}$
                                      description: The token address. This is the unique identifier of the token
                                    symbol:
                                      type: string
                                      description: The token symbol. This is not guaranteed to be unique, as multiple tokens can have the same symbol
                                  required:
                                  - address
                                  - symbol
                                  additionalProperties: false
                                  description: Properties of the tokens involved in the swap
                                description: Properties of the tokens involved in the swap
                            required:
                            - fills
                            - tokens
                            additionalProperties: false
                            description: The forward route used to acquire at least the requested buy amount
                          refund:
                            type: object
                            properties:
                              fills:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    from:
                                      type: string
                                      pattern: ^0x[a-fA-F0-9]{40}$
                                      description: The contract address of the input token
                                    to:
                                      type: string
                                      pattern: ^0x[a-fA-F0-9]{40}$
                                      description: The contract address of the output token
                                    source:
                                      type: string
                                      description: The liquidity source used in the route
                                    proportionBps:
                                      allOf:
                                      - {}
                                      - type: string
                                        pattern: ^[-+]?(0|[1-9]\d*)(\.\d+)?$
                                      description: The proportion of the trade to be filled by the `source`
                                  required:
                                  - from
                                  - to
                                  - source
                                  - proportionBps
                                  additionalProperties: false
                                description: Details of each segment that 0x routes the swap through
                              tokens:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    address:
                                      type: string
                                      pattern: ^0x[a-fA-F0-9]{40}$
                                      description: The token address. This is the unique identifier of the token
                                    symbol:
                                      type: string
                                      description: The token symbol. This is not guaranteed to be unique, as multiple tokens can have the same symbol
                                  required:
                                  - address
                                  - symbol
                                  additionalProperties: false
                                  description: Properties of the tokens involved in the swap
                                description: Properties of the tokens involved in the swap
                            required:
                            - fills
                            - tokens
                            additionalProperties: false
                            description: The refund route used to convert buy-token surplus back to the sell token
                        required:
                        - forward
                        - refund
                        additionalProperties: false
                        description: The exact-out forward and refund routes
                      maxSellAmount:
                        allOf:
                        - {}
                        - type: string
                          pattern: ^[-+]?(0|[1-9]\d*)(\.\d+)?$
                        description: The maximum amount of `sellToken` that may be spent by the exact-out swap
                      sellToken:
                        type: string
                        pattern: ^0x[a-fA-F0-9]{40}$
                        description: The contract address of the token to sell in the swap
                      tokenMetadata:
                        type: object
                        properties:
                          buyToken:
                            type: object
                            properties:
                              buyTaxBps:
                                allOf:
                                - {}
                                - type: string
                                  pattern: ^[-+]?(0|[1-9]\d*)(\.\d+)?$
                                nullable: true
                                description: The buy tax in bps of the token. Since each token could have arbitrary implementation, this field is best effort, meaning it would be set to `null` if the system is not able to determine the tax
                              sellTaxBps:
                                allOf:
                                - {}
                                - type: string
                                  pattern: ^[-+]?(0|[1-9]\d*)(\.\d+)?$
                                nullable: true
                                description: The sell tax in bps of the token. Since each token could have arbitrary implementation, this field is best effort, meaning it would be set to `null` if the system is not able to determine the tax
                              transferTaxBps:
                                allOf:
                                - {}
                                - type: string
                                  pattern: ^[-+]?(0|[1-9]\d*)(\.\d+)?$
                                nullable: true
                                description: The transfer tax in bps of the token. Since each token could have arbitrary implementation, this field is best effort, meaning it would be set to `null` if the system is not able to determine the tax
                            required:
                            - buyTaxBps
                            - sellTaxBps
                            - transferTaxBps
                            additionalProperties: false
                            description: Swap-related metadata for the buy token
                          sellToken:
                            type: object
                            properties:
                              buyTaxBps:
                                allOf:
                                - {}
                                - type: string
                                  pattern: ^[-+]?(0|[1-9]\d*)(\.\d+)?$
                                nullable: true
                                description: The buy tax in bps of the token. Since each token could have arbitrary implementation, this field is best effort, meaning it would be set to `null` if the system is not able to determine the tax
                              sellTaxBps:
                                allOf:
                                - {}
                                - type: string
                                  pattern: ^[-+]?(0|[1-9]\d*)(\.\d+)?$
                                nullable: true
                                description: The sell tax in bps of the token. Since each token could have arbitrary implementation, this field is best effort, meaning it would be set to `null` if the system is not able to determine the tax
                              transferTaxBps:
                                allOf:
                                - {}
                                - type: string
                                  pattern: ^[-+]?(0|[1-9]\d*)(\.\d+)?$
                                nullable: true
                                description: The transfer tax in bps of the token. Since each token could have arbitrary implementation, this field is best effort, meaning it would be set to `null` if the system is not able to determine the tax
                            required:
                            - buyTaxBps
                            - sellTaxBps
                            - transferTaxBps
                            additionalProperties: false
                            description: Swap-related metadata for the sell token
                        required:
                        - buyToken
                        - sellToken
                        additionalProperties: false
                        description: Swap-related metadata for the buy and sell token in the swap
                      totalNetworkFee:
                        allOf:
                        - {}
                        - type: string
                          pattern: ^[-+]?(0|[1-9]\d*)(\.\d+)?$
                        nullable: true
                        description: The estimated total network cost of the swap. On chains where there is no L1 data cost, it is calculated as `gas` * `gasPrice`. On chains where there is an L1 data cost, it is calculated as `gas` * `gasPrice` + L1 data cost.
                      zid:
                        type: string
                        description: The unique ZeroEx identifier of the request
                      gas:
                        allOf:
                        - {}
                        - type: string
                          pattern: ^[-+]?(0|[1-9]\d*)(\.\d+)?$
                        nullable: true
                        description: The estimated gas limit that should be used to send the transaction to guarantee settlement
                      gasPrice:
                        allOf:
                        - {}
                        - type: string
                          pattern: ^[-+]?(0|[1-9]\d*)(\.\d+)?$
                        description: The gas price (in wei) that should be used to send the transaction. The transaction needs to be sent with this `gasPrice` for the transaction to be successful
                    required:
                    - allowanceTarget
                    - blockNumber
                    - buyAmount
                    - buyToken
                    - estimatedNetSellAmount
                    - fees
                    - issues
                    - liquidityAvailable
                    - mode
                    - routes
                    - maxSellAmount
                    - sellToken
                    - tokenMetadata
                    - totalNetworkFee
                    - zid
                    - gas
                    - gasPrice
                    additionalProperties: false
                - type: object
                  properties:
                    liquidityAvailable:
                      type: boolean
                      enum:
                      - false
                      description: This validates the availability of liquidity for the quote requested. No other fields will be returned if it is `false`
                    zid:
                      type: string
                      description: The unique ZeroEx identifier of the request
                  required:
                  - liquidityAvailable
                  - zid
                  additionalProperties: false
              example:
                allowanceTarget: '0x000000000022d473030f116ddee9f6b43ac78ba3'
                blockNumber: '20114676'
                buyAmount: '100032748'
                buyToken: '0xdac17f958d2ee523a2206206994597c13d831ec7'
                fees:
                  integratorFee: null
                  zeroExFee: null
                  gasFee: null
                gas: '288095'
                gasPrice: '7062490000'
                issues:
                  allowance:
                    actual: '0'
                    spender: '0x0000000000001ff3684f28c67538d4d072c22734'
                  balance:
                    token: '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48'
                    actual: '0'
                    expected: '100000000'
                  simulationIncomplete: false
                  invalidSourcesPassed: []
                liquidityAvailable: true
                mode: exact-in
                minBuyAmount: '99032421'
                route:
                  fills:
                  - from: '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48'
                    to: '0xdac17f958d2ee523a2206206994597c13d831ec7'
                    source: SolidlyV3
                    proportionBps: '10000'
                  tokens:
                  - address: '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48'
                    symbol: USDC
                  - address: '0xdac17f958d2ee523a2206206994597c13d831ec7'
                    symbol: USDT
                sellAmount: '100000000'
                sellToken: '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48'
                tokenMetadata:
                  buyToken:
                    buyTaxBps: '0'
                    sellTaxBps: '0'
