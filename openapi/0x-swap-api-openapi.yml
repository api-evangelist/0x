                            - domain
                            - message
                            - primaryType
                            additionalProperties: false
                            description: Necessary data for [EIP-712](https://eips.ethereum.org/EIPS/eip-712)
                        required:
                        - type
                        - hash
                        - eip712
                        additionalProperties: false
                        description: This is the approval object which contains the necessary fields to submit an approval for this transaction. Null if sell token is the native token or the transaction is a native token wrap / unwrap
                        nullable: true
                      transaction:
                        type: object
                        properties:
                          to:
                            type: string
                            pattern: ^0x[a-fA-F0-9]{40}$
                            description: The address of the target contract to send call `data` to. Do NOT use this field when setting token allowances — doing so can result in lost funds. Always use `issues.allowance.spender` or `allowanceTarget` for setting allowances.
                          data:
