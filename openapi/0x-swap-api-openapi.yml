                                  - type: string
                                  - type: array
                                    items:
                                      type: string
                                  - type: number
                                  - type: array
                                    items:
                                      type: number
                                  - type: boolean
                                  - type: array
                                    items:
                                      type: boolean
                                  - {}
                                  - type: array
                                    items: {}
                              primaryType:
                                type: string
                            required:
